<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyRoute - Flight & Travel Booking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Base Body Setup */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* ===================================================
       THEME STYLES (Light / Default Slate / Dark)
       =================================================== */

    /* 1. LIGHT THEME (Default) */
    body.theme-light {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .theme-light header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; }
    .theme-light .sidebar { background-color: #ffffff; border-right: 1px solid #e2e8f0; }
    .theme-light input, .theme-light select { background-color: #f1f5f9; border: 1px solid #cbd5e1; color: #0f172a; }
    .theme-light .itinerary-card { background-color: #f1f5f9; border: 1px solid #e2e8f0; }
    .theme-light .card-row { color: #64748b; }
    .theme-light .card-row span { color: #0f172a; }
    .theme-light .section-title { color: #64748b; }
    .theme-light label { color: #334155; }

    /* 2. SLATE NAVY THEME */
    body.theme-default {
      background-color: #0f172a;
      color: #f8fafc;
    }
    .theme-default header { background-color: #1e293b; border-bottom: 1px solid #334155; }
    .theme-default .sidebar { background-color: #1e293b; border-right: 1px solid #334155; }
    .theme-default input, .theme-default select { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; }
    .theme-default .itinerary-card { background-color: #0f172a; border: 1px solid #334155; }
    .theme-default .card-row { color: #94a3b8; }
    .theme-default .card-row span { color: #f8fafc; }
    .theme-default .section-title { color: #94a3b8; }
    .theme-default label { color: #cbd5e1; }

    /* 3. DARK THEME (Pure OLED Black) */
    body.theme-dark {
      background-color: #000000;
      color: #ffffff;
    }
    .theme-dark header { background-color: #121212; border-bottom: 1px solid #27272a; }
    .theme-dark .sidebar { background-color: #121212; border-right: 1px solid #27272a; }
    .theme-dark input, .theme-dark select { background-color: #000000; border: 1px solid #27272a; color: #ffffff; }
    .theme-dark .itinerary-card { background-color: #18181b; border: 1px solid #27272a; }
    .theme-dark .card-row { color: #a1a1aa; }
    .theme-dark .card-row span { color: #ffffff; }
    .theme-dark .section-title { color: #a1a1aa; }
    .theme-dark label { color: #d4d4d8; }

    /* ===================================================
       LAYOUT STYLES
       =================================================== */
    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #0284c7;
    }
    .badge {
      background-color: #059669;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .sidebar {
      width: 380px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .field-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .itinerary-card {
      border-radius: 8px;
      padding: 16px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .card-row span { font-weight: 600; }
    
    .price-box {
      background-color: #0284c7;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      margin-top: 12px;
    }
    .price-amount {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }
    
    .btn-pay {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-pay:hover { background-color: #1d4ed8; }

    #map {
      flex: 1;
      height: 100%;
    }
  </style>
</head>
<body class="theme-light">

  <header>
    <div class="logo">✈️ SkyRoute <span>Flight & Travel Booking</span></div>
    <div class="badge">Hosting Cost: $0.00</div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div>
        <div class="field-group">
          <label for="theme-select">🎨 App Theme</label>
          <select id="theme-select" onchange="changeTheme()">
            <option value="theme-light" selected>Light Mode (Default)</option>
            <option value="theme-default">Slate Navy</option>
            <option value="theme-dark">Dark Mode (OLED)</option>
          </select>
        </div>

        <div class="section-title">Find Flight Route</div>

        <div class="field-group">
          <label for="origin">Origin Hub</label>
          <input type="text" id="origin" placeholder="Type departure city or IATA code...">
        </div>

        <div class="field-group">
          <label for="destination">Destination Hub</label>
          <input type="text" id="destination" placeholder="Type arrival city or IATA code...">
        </div>

        <div class="field-group">
          <label for="airline-input">Airline</label>
          <input 
            type="text" 
            id="airline-input" 
            list="airline-list" 
            placeholder="Type Airline (e.g. Etihad, BA, Delta)..."
            oninput="handleAirlineChange()"
          >
          <datalist id="airline-list">
            <option value="Delta Air Lines"></option>
            <option value="British Airways"></option>
            <option value="Etihad Airways"></option>
            <option value="Emirates"></option>
            <option value="Qatar Airways"></option>
            <option value="United Airlines"></option>
            <option value="Singapore Airlines"></option>
          </datalist>
        </div>

        <div class="field-group">
          <label for="cabin-select">Ticket Class / Cabin</label>
          <select id="cabin-select" disabled onchange="updateTicketPrice()">
            <option value="">Select an airline first...</option>
          </select>
        </div>
      </div>

      <div class="itinerary-card">
