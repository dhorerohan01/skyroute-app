<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyRoute - Global Cabin Finder</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h2 {
      margin-top: 0;
      color: #0d6efd;
      text-align: center;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0d6efd;
    }
    .info-box {
      margin-top: 15px;
      padding: 12px;
      background-color: #e7f1ff;
      border-left: 4px solid #0d6efd;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Global Flight Route Finder</h2>

    <div class="field">
      <label for="origin">Origin:</label>
      <input type="text" id="origin" placeholder="e.g., JFK, London, Sydney">
    </div>

    <div class="field">
      <label for="destination">Destination:</label>
      <input type="text" id="destination" placeholder="e.g., LHR, Dubai, Tokyo">
    </div>

    <div class="field">
      <label for="airline-input">Airline Name:</label>
      <input 
        type="text" 
        id="airline-input" 
        list="airline-list" 
        placeholder="Type any airline (e.g. Delta, Etihad, Lufthansa)..."
        oninput="handleAirlineChange()"
      >
      <datalist id="airline-list">
        <option value="Delta Air Lines"></option>
        <option value="British Airways"></option>
        <option value="Etihad Airways"></option>
        <option value="Emirates"></option>
        <option value="Qatar Airways"></option>
        <option value="United Airlines"></option>
        <option value="American Airlines"></option>
        <option value="Lufthansa"></option>
        <option value="Air France"></option>
        <option value="Singapore Airlines"></option>
        <option value="Cathay Pacific"></option>
        <option value="Qantas"></option>
        <option value="Air India"></option>
        <option value="KLM"></option>
        <option value="ANA (All Nippon Airways)"></option>
        <option value="Japan Airlines"></option>
        <option value="Turkish Airlines"></option>
        <option value="Virgin Atlantic"></option>
        <option value="Korean Air"></option>
        <option value="Air Canada"></option>
        <option value="SWISS"></option>
      </datalist>
    </div>

    <div class="field">
      <label for="cabin-select">Cabin Class:</label>
      <select id="cabin-select" disabled>
        <option value="">Type an airline above first...</option>
      </select>
    </div>

    <div id="status" class="info-box">
      Start typing an airline name to load its specific cabin products!
    </div>
  </div>

  <script>
    // Comprehensive database of global airlines and their cabin brand names
    const globalAirlineCabins = {
      "delta": ["Basic Economy", "Main Cabin", "Delta Comfort+", "Delta First Class", "Delta Premium Select", "Delta One"],
      "british airways": ["Euro Traveller (Short-haul Economy)", "World Traveller (Long-haul Economy)", "World Traveller Plus (Premium Economy)", "Club Europe (Short-haul Business)", "Club World (Long-haul Business)", "First Class"],
      "etihad": ["Economy Choice & Space", "Business Studio", "First Class Suite", "The Residence"],
      "emirates": ["Economy Class", "Premium Economy", "Business Class", "First Class Private Suite"],
      "qatar": ["Economy Class", "Business Class (Qsuite)", "First Class"],
      "united": ["United Economy", "United Economy Plus", "United Premium Plus", "United First", "United Polaris Business"],
      "american": ["Main Cabin", "Main Cabin Extra", "Premium Economy", "Flagship Business", "Flagship First", "Flagship Suite"],
      "lufthansa": ["Economy Class", "Premium Economy", "Business Class", "First Class", "Allegris First Class"],
      "air france": ["Economy", "Premium Economy", "Business Class", "La Première (First Class)"],
      "singapore airlines": ["Economy Class", "Premium Economy Class", "Business Class", "First Class", "Suites"],
      "cathay pacific": ["Economy Class", "Premium Economy", "Business Class (Aria Suite)", "First Class"],
      "qantas": ["Economy", "Premium Economy", "Business Class", "First Class"],
      "air india": ["Economy Class", "Premium Economy", "Executive Class (Business)", "First Class"],
      "klm": ["Economy Class", "Premium Comfort", "World Business Class"],
      "ana": ["Economy Class", "Premium Economy", "Business Class (The Room)", "First Class (The Suite)"],
      "japan airlines": ["Economy Class", "Premium Economy", "Business Class", "First Class"],
      "turkish": ["Economy Class", "Business Class"],
      "virgin atlantic": ["Economy Light/Classic/Delight", "Premium", "Upper Class"],
      "korean air": ["Economy Class", "Prestige Class (Business)", "First Class (Kosmo Suite)"],
      "air canada": ["Economy Class", "Premium Economy", "Signature Class (Business)"],
      "swiss": ["Economy Class", "Premium Economy", "Business Class", "First Class (SWISS First)"],
      "ryanair": ["Standard Fare", "Regular", "Plus", "Flexi Plus"],
      "easyjet": ["Standard Seat", "Up Front Seat", "Extra Legroom"],
      "southwest": ["Basic", "Choice", "Choice Plus"]
    };

    // Generic fallback classes for unlisted airlines
    const standardCabins = [
      "Economy Class",
      "Premium Economy",
      "Business Class",
      "First Class"
    ];

    function handleAirlineChange() {
      const inputVal = document.getElementById("airline-input").value.trim().toLowerCase();
      const cabinSelect = document.getElementById("cabin-select");
      const statusBox = document.getElementById("status");

      cabinSelect.innerHTML = "";

      if (!inputVal) {
        cabinSelect.disabled = true;
        const defaultOption = document.createElement("option");
        defaultOption.textContent = "Type an airline above first...";
        cabinSelect.appendChild(defaultOption);
        statusBox.textContent = "Start typing an airline name to load its specific cabin products!";
        return;
      }

      // Check if input matches key in dataset
      let matchedKey = Object.keys(globalAirlineCabins).find(key => inputVal.includes(key) || key.includes(inputVal));

      let cabinsToLoad = matchedKey ? globalAirlineCabins[matchedKey] : standardCabins;
      cabinSelect.disabled = false;

      cabinsToLoad.forEach(cabin => {
        const option = document.createElement("option");
        option.value = cabin;
        option.textContent = cabin;
        cabinSelect.appendChild(option);
      });

      if (matchedKey) {
        statusBox.textContent = `Loaded ${cabinsToLoad.length} custom branded cabin classes for ${inputVal.toUpperCase()}.`;
      } else {
        statusBox.textContent = `Loaded standard cabin options for "${inputVal}".`;
      }
    }
  </script>

</body>
</html>
