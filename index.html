<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyRoute - Flight & Travel Booking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }
    .badge {
      background-color: #059669;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Layout */
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    /* Sidebar */
    .sidebar {
      width: 380px;
      background-color: #1e293b;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    /* Form Controls */
    .field-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
    input, select {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
    }

    /* Itinerary Box */
    .itinerary-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    .card-row span { color: #f8fafc; font-weight: 600; }
    
    .price-box {
      background-color: #0284c7;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      margin-top: 12px;
    }
    .price-amount {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }
    
    .btn-pay {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-pay:hover { background-color: #1d4ed8; }

    /* Map */
    #map {
      flex: 1;
      height: 100%;
      background-color: #090d16;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">✈️ SkyRoute <span>Flight & Travel Booking</span></div>
    <div class="badge">Hosting Cost: $0.00</div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div>
        <div class="section-title">Find Flight Route</div>

        <div class="field-group">
          <label for="origin">Origin Hub</label>
          <input type="text" id="origin" placeholder="Type departure city or IATA code...">
        </div>

        <div class="field-group">
          <label for="destination">Destination Hub</label>
          <input type="text" id="destination" placeholder="Type arrival city or IATA code...">
        </div>

        <div class="field-group">
          <label for="airline-input">Airline</label>
          <input 
            type="text" 
            id="airline-input" 
            list="airline-list" 
            placeholder="Type Airline (e.g. Etihad, BA, Delta)..."
            oninput="handleAirlineChange()"
          >
          <datalist id="airline-list">
            <option value="Delta Air Lines"></option>
            <option value="British Airways"></option>
            <option value="Etihad Airways"></option>
            <option value="Emirates"></option>
            <option value="Qatar Airways"></option>
            <option value="United Airlines"></option>
            <option value="Singapore Airlines"></option>
          </datalist>
        </div>

        <div class="field-group">
          <label for="cabin-select">Ticket Class / Cabin</label>
          <select id="cabin-select" disabled onchange="updateTicketPrice()">
            <option value="">Select an airline first...</option>
          </select>
        </div>
      </div>

      <div class="itinerary-card">
        <div class="section-title" style="margin-bottom:12px;">Flight Itinerary & Details</div>
        <div class="card-row">Airline: <span id="summary-airline">--</span></div>
        <div class="card-row">Cabin: <span id="summary-cabin">--</span></div>
        
        <div class="price-box">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px;">Total Ticket Fare</div>
          <div class="price-amount" id="ticket-fare">$0.00</div>
        </div>

        <button class="btn-pay" onclick="alert('Ticket Reserved Successfully!')">💳 Pay Now & Reserve Ticket</button>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize Dark Map
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Global Cabin Mapping
    const globalAirlineCabins = {
      "delta": ["Basic Economy", "Main Cabin", "Delta Comfort+", "Delta First Class", "Delta Premium Select", "Delta One"],
      "british airways": ["Euro Traveller (Economy)", "World Traveller (Economy)", "World Traveller Plus (Premium Eco)", "Club Europe (Business)", "Club World (Business)", "First Class"],
      "etihad": ["Economy Choice & Space", "Business Studio", "First Class Suite", "The Residence"],
      "emirates": ["Economy Class", "Premium Economy", "Business Class", "First Class Private Suite"],
      "qatar": ["Economy Class", "Business Class (Qsuite)", "First Class"],
      "united": ["United Economy", "United Economy Plus", "United Premium Plus", "United First", "United Polaris Business"],
      "singapore": ["Economy Class", "Premium Economy Class", "Business Class", "First Class", "Suites"]
    };

    const defaultCabins = ["Economy Class", "Premium Economy", "Business Class", "First Class"];

    function handleAirlineChange() {
      const inputVal = document.getElementById("airline-input").value.trim().toLowerCase();
      const cabinSelect = document.getElementById("cabin-select");
      const summaryAirline = document.getElementById("summary-airline");

      cabinSelect.innerHTML = "";
      summaryAirline.textContent = inputVal ? document.getElementById("airline-input").value : "--";

      if (!inputVal) {
        cabinSelect.disabled = true;
        const defaultOption = document.createElement("option");
        defaultOption.textContent = "Select an airline first...";
        cabinSelect.appendChild(defaultOption);
        return;
      }

      let matchedKey = Object.keys(globalAirlineCabins).find(key => inputVal.includes(key) || key.includes(inputVal));
      let cabinsToLoad = matchedKey ? globalAirlineCabins[matchedKey] : defaultCabins;

      cabinSelect.disabled = false;
      cabinsToLoad.forEach(cabin => {
        const option = document.createElement("option");
        option.value = cabin;
        option.textContent = cabin;
        cabinSelect.appendChild(option);
      });

      updateTicketPrice();
    }

    function updateTicketPrice() {
      const cabin = document.getElementById("cabin-select").value;
      const summaryCabin = document.getElementById("summary-cabin");
      const priceDisplay = document.getElementById("ticket-fare");

      summaryCabin.textContent = cabin || "--";

      // Simple mock pricing based on cabin type
      let price = 450;
      if (cabin.includes("Premium") || cabin.includes("Comfort") || cabin.includes("Plus")) price = 850;
      if (cabin.includes("Business") || cabin.includes("Club") || cabin.includes("Polaris")) price = 2400;
      if (cabin.includes("First") || cabin.includes("Residence") || cabin.includes("Suite")) price = 5200;

      priceDisplay.textContent = `$${price.toLocaleString()}.00`;
    }
  </script>
</body>
</html>
