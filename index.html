<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyRoute - Executive Dynamic Search Engine</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #f8fafc;
      color: #0f172a;
    }

    header { padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; background: #ffffff; border-bottom: 1px solid #e2e8f0; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #0284c7; }
    .badge { background-color: #059669; color: #ffffff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    
    .container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 420px; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background: #ffffff; border-right: 1px solid #e2e8f0; }
    .section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; color: #64748b; }
    
    .field-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: 600; color: #334155; }
    input, select { width: 100%; padding: 10px 14px; border-radius: 8px; font-size: 14px; background-color: #f1f5f9; border: 1px solid #cbd5e1; color: #0f172a; outline: none; }
    input:focus, select:focus { border-color: #0284c7; }

    .stop-input-wrapper { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn-remove { background: #ef4444; color: white; border: none; padding: 0 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-add-stop { width: 100%; background: #e0f2fe; color: #0369a1; border: 1px dashed #0284c7; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }

    .itinerary-card { border-radius: 12px; padding: 18px; background-color: #f1f5f9; border: 1px solid #e2e8f0; }
    .card-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #64748b; }
    .card-row span { font-weight: 700; color: #0f172a; }
    .route-badge { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 11px; text-transform: uppercase; }
    
    .price-box { background: linear-gradient(135deg, #0284c7, #2563eb); border-radius: 10px; padding: 14px; text-align: center; margin-top: 14px; }
    .price-amount { font-size: 26px; font-weight: 900; color: #ffffff; }
    
    .btn-pay { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 12px; }
    #map { flex: 1; height: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="logo">✈️ SkyRoute <span>Universal Route Search</span></div>
    <div class="badge">Universal Acceptance Engine</div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div>
        <div class="section-title">Flight Configuration</div>

        <div class="field-group">
          <label for="origin">Origin (Type ANY City or Airport)</label>
          <input type="text" id="origin" value="Minneapolis" placeholder="e.g., Oslo, Cancun, Tokyo, MSP..." onchange="updateFullRoute()">
        </div>

        <div class="field-group">
          <label>Layover Cities (Type ANY City or Airport)</label>
          <div id="stops-container"></div>
          <button class="btn-add-stop" onclick="addStopoverField()">+ Add Layover City</button>
        </div>

        <div class="field-group">
          <label for="destination">Destination (Type ANY City or Airport)</label>
          <input type="text" id="destination" value="Mumbai" placeholder="e.g., Reykjavik, Sydney, BOM..." onchange="updateFullRoute()">
        </div>

        <div class="field-group">
          <label for="airline-input">Carrier (Type ANY Airline Name)</label>
          <input 
            type="text" 
            id="airline-input" 
            value="Delta / KLM"
            placeholder="Type ANY Airline (e.g., Breeze, Norse, Custom Jet)..."
            oninput="handleAirlineChange()"
          >
        </div>

        <div class="field-group">
          <label for="cabin-select">Seating Class / Cabin</label>
          <select id="cabin-select" onchange="updateTicketPrice()">
            </select>
        </div>
      </div>

      <div class="itinerary-card">
        <div class="section-title" style="margin-bottom:12px;">Itinerary Summary</div>
        <div class="card-row">Routing: <span id="summary-stops" class="route-badge">Nonstop</span></div>
        <div class="card-row">Path: <span id="summary-path">--</span></div>
        <div class="card-row">Carrier: <span id="summary-carrier">--</span></div>
        <div class="card-row">Cabin: <span id="summary-cabin">--</span></div>
        
        <div class="price-box">
          <div style="font-size:11px; text-transform:uppercase; color:#ffffff; opacity:0.9;">Total Estimated Fare</div>
          <div class="price-amount" id="ticket-fare">$0.00</div>
        </div>

        <button class="btn-pay" onclick="alert('Route Confirmed Successfully!')">💳 Pay & Reserve Ticket</button>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

    // Fallback dictionary for instant lookup of common IATA codes/cities
    const knownCoords = {
      "MSP": [44.8848, -93.2223], "MINNEAPOLIS": [44.8848, -93.2223],
      "AMS": [52.3105, 4.7683],   "AMSTERDAM": [52.3105, 4.7683],
      "BOM": [19.0896, 72.8656],  "MUMBAI": [19.0896, 72.8656],
      "LHR": [51.4700, -0.4543],  "LONDON": [51.4700, -0.4543],
      "JFK": [40.6413, -73.7781],  "NEW YORK": [40.6413, -73.7781],
      "DXB": [25.2532, 55.3657],  "DUBAI": [25.2532, 55.3657]
    };

    const globalAirlineCabins = {
      "delta": ["Basic Economy", "Main Cabin", "Delta Comfort+", "Delta First Class", "Delta Premium Select", "Delta One"],
      "klm": ["Economy Class", "Premium Comfort", "World Business Class"],
      "british airways": ["Euro Traveller", "World Traveller", "World Traveller Plus", "Club World", "First Class"],
      "emirates": ["Economy Class", "Premium Economy", "Business Class", "First Class Private Suite"]
    };

    let mapLayers = [];

    // Fetch coordinates dynamically from OpenStreetMap API if not in cache
    async function getCityCoordinates(cityName) {
      const cleanName = cityName.trim();
      const upperKey = cleanName.toUpperCase();

      if (knownCoords[upperKey]) return knownCoords[upperKey];

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cleanName)}`);
        const data = await response.json();
        if (data && data.length > 0) {
          const latLng = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          knownCoords[upperKey] = latLng; // Cache result
          return latLng;
        }
      } catch (err) {
        console.warn("Geocoding lookup error for:", cleanName);
      }
      return null;
    }

    function addStopoverField(value = "") {
      const container = document.getElementById("stops-container");
      const div = document.createElement("div");
      div.className = "stop-input-wrapper";
      
      div.innerHTML = `
        <input type="text" class="stop-input" value="${value}" placeholder="Type ANY Layover City..." onchange="updateFullRoute()">
        <button class="btn-remove" onclick="removeStopover(this)">✕</button>
      `;
      container.appendChild(div);
      updateFullRoute();
    }

    function removeStopover(btn) {
      btn.parentElement.remove();
      updateFullRoute();
    }

    async function updateFullRoute() {
      const origin = document.getElementById("origin").value.trim();
      const destination = document.getElementById("destination").value.trim();
      const stopElements = document.querySelectorAll(".stop-input");
      
      let stops = [];
      stopElements.forEach(input => {
        if (input.value.trim()) stops.push(input.value.trim());
      });

      let fullPath = [];
      if (origin) fullPath.push(origin);
      stops.forEach(s => fullPath.push(s));
      if (destination) fullPath.push(destination);

      const stopsSpan = document.getElementById("summary-stops");
      const pathSpan = document.getElementById("summary-path");
      
      if (stops.length === 0) {
        stopsSpan.textContent = "Nonstop Flight";
        stopsSpan.style.background = "#dcfce7";
        stopsSpan.style.color = "#15803d";
      } else {
        stopsSpan.textContent = `${stops.length}-Stop Connection`;
        stopsSpan.style.background = "#e0f2fe";
        stopsSpan.style.color = "#0369a1";
      }

      pathSpan.textContent = fullPath.length > 0 ? fullPath.join(" → ") : "--";

      await drawRouteOnMap(fullPath);
      updateTicketPrice();
    }

    async function drawRouteOnMap(cityList) {
      mapLayers.forEach(layer => map.removeLayer(layer));
      mapLayers = [];

      let latLngs = [];
      for (const city of cityList) {
        const coords = await getCityCoordinates(city);
        if (coords) latLngs.push(coords);
      }

      if (latLngs.length >= 2) {
        const isNonstop = latLngs.length === 2;
        const polyline = L.polyline(latLngs, {
          color: '#0284c7',
          weight: 4,
          dashArray: isNonstop ? '' : '8, 8'
        }).addTo(map);
        
        mapLayers.push(polyline);

        latLngs.forEach((coords, idx) => {
          const marker = L.circleMarker(coords, { radius: 6, color: '#2563eb', fillColor: '#ffffff', fillOpacity: 1 }).addTo(map);
          marker.bindPopup(`<b>${cityList[idx]}</b>`);
          mapLayers.push(marker);
        });

        map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
      }
    }

    // Dynamic Airline Engine (Accepts ANY typed airline)
    function handleAirlineChange() {
      const rawInput = document.getElementById("airline-input").value.trim();
      const inputVal = rawInput.toLowerCase();
      const cabinSelect = document.getElementById("cabin-select");
      const summaryCarrier = document.getElementById("summary-carrier");

      cabinSelect.innerHTML = "";
      summaryCarrier.textContent = rawInput || "--";

      if (!rawInput) {
        cabinSelect.disabled = true;
        return;
      }

      let matchedKey = Object.keys(globalAirlineCabins).find(key => inputVal.includes(key) || key.includes(inputVal));
      
      let cabinsToLoad = [];
      if (matchedKey) {
        cabinsToLoad = globalAirlineCabins[matchedKey];
      } else {
        // Universal dynamic generator for ANY entered airline
        const formatted = rawInput.charAt(0).toUpperCase() + rawInput.slice(1);
        cabinsToLoad = [
          `${formatted} Economy Class`,
          `${formatted} Premium Economy`,
          `${formatted} Business Class`,
          `${formatted} First Class`
        ];
      }

      cabinSelect.disabled = false;
      cabinsToLoad.forEach(cabin => {
        const option = document.createElement("option");
        option.value = cabin;
        option.textContent = cabin;
        cabinSelect.appendChild(option);
      });

      updateTicketPrice();
    }

    function updateTicketPrice() {
      const cabin = document.getElementById("cabin-select").value || "";
      const stopElements = document.querySelectorAll(".stop-input");
      const numberOfStops = stopElements.length;
      
      const summaryCabin = document.getElementById("summary-cabin");
      const priceDisplay = document.getElementById("ticket-fare");

      summaryCabin.textContent = cabin || "Economy Class";

      let basePrice = 550 + (numberOfStops * 275);
      
      if (cabin.includes("Premium") || cabin.includes("Comfort") || cabin.includes("Plus")) basePrice += 450;
      if (cabin.includes("Business") || cabin.includes("Club") || cabin.includes("Polaris") || cabin.includes("Studio")) basePrice += 1950;
      if (cabin.includes("First") || cabin.includes("Residence") || cabin.includes("Suite")) basePrice += 4500;

      priceDisplay.textContent = `$${basePrice.toLocaleString()}.00`;
    }

    addStopoverField("Amsterdam");
    handleAirlineChange();
  </script>
</body>
</html>
